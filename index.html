<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиноКаталог</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="welcome-screen" class="screen">
        <div class="welcome-card">
            <h1>КиноКаталог</h1>
            <p>Введите ваше имя для входа</p>
            <input type="text" id="username-input" placeholder="Имя пользователя" autocomplete="off">
            <button id="start-btn">Войти в систему</button>
        </div>
    </div>

    <div id="main-screen" class="screen hidden">
        <header>
            <h2 id="greeting-text"></h2>
        </header>
        <main>
            <div id="controls-panel" class="controls-panel">
                <div class="search-group">
                    <input type="text" id="search-input" value="Batman" autocomplete="off">
                    <button id="search-btn">Искать</button>
                </div>
                <div class="filter-group">
                    <label class="custom-checkbox"><input type="checkbox" id="filter-movie" checked> <span>Фильмы</span></label>
                    <label class="custom-checkbox"><input type="checkbox" id="filter-series" checked> <span>Сериалы</span></label>
                    <label class="custom-checkbox"><input type="checkbox" id="filter-game" checked> <span>Игры</span></label>
                </div>
                <div class="sort-group">
                    <select id="sort-select">
                        <option value="default">Без сортировки</option>
                        <option value="year-asc">Сначала старые</option>
                        <option value="year-desc">Сначала новые</option>
                    </select>
                </div>
                <div id="statistics-panel" class="stats-panel"></div>
            </div>
            
            <div id="error-message" class="error-message hidden"></div>
            <div id="loader" class="loader hidden"></div>
            
            <div id="data-container" class="grid-container"></div>
            
            <div class="load-more-container">
                <button id="load-more-btn" class="hidden">Загрузить еще</button>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
